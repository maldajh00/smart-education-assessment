# GKE Ingress → Google Cloud external HTTPS Load Balancer.
#
# TLS options (choose one before applying):
#
#  1. Google-managed certificate (recommended for production):
#     - Uncomment the ManagedCertificate below, set spec.domains to your DNS name.
#     - Add annotation networking.gke.io/managed-certificates: smart-education-cert to the Ingress.
#     - Add annotation kubernetes.io/ingress.global-static-ip-name: <your-reserved-static-ip> once the LB IP is stable.
#
#  2. Kubernetes TLS Secret (for staging / testing):
#     - Create secret: kubectl create secret tls smart-education-tls --cert=tls.crt --key=tls.key -n smart-education
#     - Reference under spec.tls[0].secretName below.
---
# apiVersion: networking.gke.io/v1
# kind: ManagedCertificate
# metadata:
#   name: smart-education-cert
#   namespace: smart-education
# spec:
#   domains:
#     - smart-education.example.com
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: smart-education-ingress
  namespace: smart-education
  labels:
    app.kubernetes.io/part-of: smart-education-portal
  annotations:
    kubernetes.io/ingress.class: "gce"
    # kubernetes.io/ingress.global-static-ip-name: "smart-education-ip"
    # networking.gke.io/managed-certificates: "smart-education-cert"
    # Redirects HTTP → HTTPS once TLS is configured.
    # networking.gke.io/v1beta1.FrontendConfig: "smart-education-frontendconfig"
spec:
  # tls:
  #   - secretName: smart-education-tls
  #     hosts:
  #       - smart-education.example.com
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend-service
                port:
                  number: 80
          - path: /health
            pathType: Exact
            backend:
              service:
                name: backend-service
                port:
                  number: 80
          - path: /ready
            pathType: Exact
            backend:
              service:
                name: backend-service
                port:
                  number: 80
          - path: /docs
            pathType: Prefix
            backend:
              service:
                name: backend-service
                port:
                  number: 80
          - path: /openapi.json
            pathType: Exact
            backend:
              service:
                name: backend-service
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 80

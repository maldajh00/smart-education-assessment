# PLACEHOLDER SECRET — for local kind/minikube testing only.
#
# DO NOT commit real credentials. For production on GKE, source secrets from:
#   - Google Secret Manager (via External Secrets Operator or CSI driver)
#   - Or a Cloud SQL IAM user reached with Workload Identity (no password at all)
#
# Replace values with your own and re-apply, or delete this file and
# `kubectl create secret generic backend-secret --from-literal=...` manually.
apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
  namespace: smart-education
  labels:
    app.kubernetes.io/name: smart-education-backend
    app.kubernetes.io/part-of: smart-education-portal
type: Opaque
stringData:
  DATABASE_USER: "smart_education"
  DATABASE_PASSWORD: "CHANGE_ME_BEFORE_APPLYING"

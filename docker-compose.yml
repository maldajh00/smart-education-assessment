name: smart-education-portal

services:
  postgres:
    image: postgres:16-alpine
    container_name: se-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-smart_education}
      POSTGRES_USER: ${DATABASE_USER:-smart_education}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-change_me_in_local_env}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - smart-education-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-smart_education} -d ${DATABASE_NAME:-smart_education}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: smart-education-backend:local
    container_name: se-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_VERSION: ${APP_VERSION:-1.0.0}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ${DATABASE_NAME:-smart_education}
      DATABASE_USER: ${DATABASE_USER:-smart_education}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-change_me_in_local_env}
      RUN_MIGRATIONS: "1"
      RUN_SEED: "1"
    ports:
      - "8000:8000"
    networks:
      - smart-education-network
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=2).status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: smart-education-frontend:local
    container_name: se-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      # Host port 5173 → container's non-root nginx on 8080, so the URL you
      # were promised in the spec (http://localhost:5173) keeps working.
      - "5173:8080"
    networks:
      - smart-education-network

networks:
  smart-education-network:
    driver: bridge

volumes:
  postgres_data:
    name: smart-education-postgres-data

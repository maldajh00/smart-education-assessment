worker_processes auto;

# Log to stdout/stderr so container platforms can collect them.
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Writable temp paths under /tmp so the non-root user can use them.
    client_body_temp_path /tmp/client_body;
    proxy_temp_path       /tmp/proxy;
    fastcgi_temp_path     /tmp/fastcgi;
    uwsgi_temp_path       /tmp/uwsgi;
    scgi_temp_path        /tmp/scgi;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout 65;
    server_tokens   off;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    access_log /dev/stdout;

    # Backend upstream. In docker-compose we resolve "backend" to the FastAPI service.
    # In Kubernetes the Ingress handles /api routing directly, so this proxy_pass
    # block is only exercised in single-container / local deployments.
    upstream backend_upstream {
        server backend-service:80;
    }

    server {
        listen 8080 default_server;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # Security headers (kept minimal; refine per hosting environment).
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Static assets: aggressive caching (hashed filenames from Vite).
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # Backend passthrough for /api and health endpoints.
        location /api/ {
            proxy_pass http://backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }
        location = /health { proxy_pass http://backend_upstream; }
        location = /ready  { proxy_pass http://backend_upstream; }

        # SPA fallback: any unknown path falls back to index.html for React Router.
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}

name: Build & push images to Artifact Registry

on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Extra image tag (in addition to git SHA + APP_VERSION)"
        required: false
        default: ""

# Required for Workload Identity Federation:
permissions:
  contents: read
  id-token: write   # lets GitHub mint an OIDC token for GCP

env:
  GCP_PROJECT_ID: smart-education-assignment
  AR_LOCATION: me-central1
  AR_HOST: me-central1-docker.pkg.dev
  AR_REPO: prod-gke-repo
  APP_VERSION: "1.0.0"

jobs:
  push:
    name: Build & push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: auth
        name: Authenticate to Google Cloud (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          # Values come from repository secrets — see README.
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          token_format: access_token

      - name: Configure Docker for Artifact Registry
        run: |
          echo "${{ steps.auth.outputs.access_token }}" \
            | docker login -u oauth2accesstoken --password-stdin https://${{ env.AR_HOST }}

      - uses: docker/setup-buildx-action@v3

      - name: Compute image tags
        id: tags
        run: |
          SHA_SHORT="${GITHUB_SHA::7}"
          BACKEND="${AR_HOST}/${GCP_PROJECT_ID}/${AR_REPO}/smart-education-backend"
          FRONTEND="${AR_HOST}/${GCP_PROJECT_ID}/${AR_REPO}/smart-education-frontend"

          BACKEND_TAGS="${BACKEND}:${APP_VERSION},${BACKEND}:sha-${SHA_SHORT}"
          FRONTEND_TAGS="${FRONTEND}:${APP_VERSION},${FRONTEND}:sha-${SHA_SHORT}"

          if [ -n "${{ inputs.tag }}" ]; then
            BACKEND_TAGS="${BACKEND_TAGS},${BACKEND}:${{ inputs.tag }}"
            FRONTEND_TAGS="${FRONTEND_TAGS},${FRONTEND}:${{ inputs.tag }}"
          fi

          echo "backend=${BACKEND_TAGS}" >> "$GITHUB_OUTPUT"
          echo "frontend=${FRONTEND_TAGS}" >> "$GITHUB_OUTPUT"
          {
            echo "### Image tags"
            echo "- backend: \`${BACKEND_TAGS}\`"
            echo "- frontend: \`${FRONTEND_TAGS}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          platforms: linux/amd64
          provenance: false
          tags: ${{ steps.tags.outputs.backend }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          platforms: linux/amd64
          provenance: false
          tags: ${{ steps.tags.outputs.frontend }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

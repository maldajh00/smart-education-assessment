name: CI, Publish & GitOps Promotion

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Required for Google Cloud Workload Identity Federation.
permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: smart-education-assignment
  AR_HOST: me-central1-docker.pkg.dev
  AR_REPO: prod-gke-repo
  BACKEND_IMAGE: me-central1-docker.pkg.dev/smart-education-assignment/prod-gke-repo/smart-education-backend
  FRONTEND_IMAGE: me-central1-docker.pkg.dev/smart-education-assignment/prod-gke-repo/smart-education-frontend
  APP_VERSION: "1.0.0"

jobs:

  # ============================================================
  # 1. BACKEND TESTS
  # ============================================================
  backend-tests:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest
        working-directory: backend
        env:
          DATABASE_HOST: "127.0.0.1"
          DATABASE_PORT: "1"
          DATABASE_NAME: "ci"
          DATABASE_USER: "ci"
          DATABASE_PASSWORD: "ci"
          CORS_ORIGINS: "http://localhost:5173"
        run: pytest -q


  # ============================================================
  # 2. FRONTEND BUILD
  # ============================================================
  frontend-build:
    name: Frontend build (tsc + vite)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Type-check + build
        working-directory: frontend
        run: npm run build


  # ============================================================
  # 3. DOCKER BUILD VALIDATION
  # ============================================================
  docker-build:
    name: Docker build (validation, no push)
    runs-on: ubuntu-latest
    needs:
      - backend-tests
      - frontend-build

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          load: false
          tags: smart-education-backend:ci-${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          load: false
          tags: smart-education-frontend:ci-${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend


  # ============================================================
  # 4. PUBLISH IMAGES TO ARTIFACT REGISTRY
  # ============================================================
  publish:
    name: Push images to Artifact Registry
    runs-on: ubuntu-latest

    needs:
      - backend-tests
      - frontend-build
      - docker-build

    # Only main pushes can publish images.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - id: auth
        name: Authenticate to Google Cloud (Workload Identity Federation)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/940549323188/locations/global/workloadIdentityPools/github-actions-pool/providers/github-provider
          service_account: github-actions-gsa@smart-education-assignment.iam.gserviceaccount.com

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.AR_HOST }} --quiet

      - uses: docker/setup-buildx-action@v3

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          platforms: linux/amd64
          provenance: false
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
            ${{ env.BACKEND_IMAGE }}:${{ env.APP_VERSION }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          platforms: linux/amd64
          provenance: false
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
            ${{ env.FRONTEND_IMAGE }}:${{ env.APP_VERSION }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Publish summary
        run: |
          {
            echo "### Published images"
            echo "- \`${BACKEND_IMAGE}:${GITHUB_SHA}\`"
            echo "- \`${BACKEND_IMAGE}:${APP_VERSION}\`"
            echo "- \`${FRONTEND_IMAGE}:${GITHUB_SHA}\`"
            echo "- \`${FRONTEND_IMAGE}:${APP_VERSION}\`"
          } >> "$GITHUB_STEP_SUMMARY"


  # ============================================================
  # 5. PROMOTE IMAGE SHA TO GITOPS REPOSITORY
  # ============================================================
  promote-gitops:
    name: Promote image SHA to GitOps
    runs-on: ubuntu-latest

    needs:
      - publish

    # Only run after successful publication from main.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:

      - name: Checkout application repository
        uses: actions/checkout@v4

      - name: Checkout GitOps repository
        uses: actions/checkout@v4
        with:
          repository: maldajh00/smart-education-gitops
          token: ${{ secrets.GITOPS_REPO_TOKEN }}
          path: gitops
          ref: main

      # --------------------------------------------------------
      # Update both production images to the immutable Git SHA.
      # --------------------------------------------------------
      - name: Update production image tags
        env:
          IMAGE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          FILE="gitops/k8s/overlays/prod/kustomization.yaml"

          echo "Production manifest:"
          echo "$FILE"

          echo
          echo "Current image tags:"
          grep -n "newTag:" "$FILE"

          echo
          echo "Promoting image SHA:"
          echo "$IMAGE_SHA"

          python3 - <<'PYTHON'
          from pathlib import Path
          import os

          path = Path("gitops/k8s/overlays/prod/kustomization.yaml")
          image_sha = os.environ["IMAGE_SHA"]

          lines = path.read_text().splitlines()
          updated = 0

          for i, line in enumerate(lines):
              if line.strip().startswith("newTag:"):
                  prefix = line.split("newTag:", 1)[0]
                  lines[i] = f"{prefix}newTag: {image_sha}"
                  updated += 1

          if updated != 2:
              raise SystemExit(f"Expected 2 image tags, but found {updated}")

          path.write_text("\n".join(lines) + "\n")
          print(f"Updated {updated} image tags to {image_sha}")
          PYTHON

          echo
          echo "Updated image tags:"
          grep -n "newTag:" "$FILE"

      # --------------------------------------------------------
      # Validate the GitOps change before committing.
      # --------------------------------------------------------
      - name: Validate GitOps manifests
        run: |
          set -euo pipefail

          cd gitops

          echo "Checking Git diff..."
          git diff --check

          echo
          echo "Production kustomization diff:"
          git diff -- k8s/overlays/prod/kustomization.yaml

      # --------------------------------------------------------
      # Commit the desired state into Git.
      # --------------------------------------------------------
      - name: Commit and push GitOps change
        env:
          IMAGE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          cd gitops

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- k8s/overlays/prod/kustomization.yaml; then
            echo "No GitOps image change detected."
            exit 0
          fi

          git add k8s/overlays/prod/kustomization.yaml

          git commit \
            -m "deploy: promote ${IMAGE_SHA}"

          git push origin main

      # --------------------------------------------------------
      # Provide evidence in GitHub Actions.
      # --------------------------------------------------------
      - name: Promotion summary
        run: |
          cd gitops

          echo "### GitOps Promotion" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Application commit: \`${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- GitOps repository: \`maldajh00/smart-education-gitops\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- GitOps revision:" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          git log -1 --oneline >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Production image tags:" >> "$GITHUB_STEP_SUMMARY"
          grep "newTag:" k8s/overlays/prod/kustomization.yaml >> "$GITHUB_STEP_SUMMARY"
